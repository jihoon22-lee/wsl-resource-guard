name: Checks
on:
  workflow_call:
    inputs:
      rehearsal_check_failure:
        description: 'Failure-only injection for a manual release rehearsal'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '${{ matrix.python }}'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Create and verify the locked environment
        run: |
          uv sync --locked --extra web --group dev --no-build --no-install-project --no-python-downloads --python "$(command -v python)"
          .venv/bin/python scripts/dependency_profiles.py
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/ci_unit.py
  browser-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Create and verify the locked environment
        run: |
          uv sync --locked --extra web --group dev --no-build --no-install-project --no-python-downloads --python "$(command -v python)"
          .venv/bin/python scripts/dependency_profiles.py
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m playwright install --with-deps chromium webkit
      - run: |
          node --check wsl_resource_guard/web/app.js
          node --check wsl_resource_guard/web/investigate.js
          node --check wsl_resource_guard/web/theme.js
          node --check wsl_resource_guard/web/sw.js
          node tests/worker_notifications.js
          shellcheck install-user.sh install-root.sh install-services.sh
          bash -n install-user.sh install-root.sh install-services.sh
          python tests/browser_offline.py
          python tests/browser_review_scenarios.py --browser chromium
          python tests/browser_review_scenarios.py --browser webkit
          python tests/browser_actionable.py --browser chromium
          python tests/browser_actionable.py --browser webkit
          python tests/browser_scale.py --iterations 1
          python tests/gunicorn_transport.py -q
      - name: Validate workflow syntax
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: |
          python scripts/release.py build dist
          python scripts/release.py build dist-again
          cmp dist/*.tar.gz dist-again/*.tar.gz
          python scripts/release.py verify dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1
  artifact-roundtrip:
    needs: browser-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-release-assets
          path: received
          digest-mismatch: error
      - name: Verify transported release without publishing
        run: |
          cd received
          sha256sum -c SHA256SUMS
          cd ..
          python3 scripts/release.py verify received/*.tar.gz
          python3 scripts/release.py build expected
          cmp received/SHA256SUMS expected/SHA256SUMS
          cmp received/*.tar.gz expected/*.tar.gz
      - name: Prepare dependencies from the verified archive without Git
        run: |
          archive_root=$(mktemp -d "$RUNNER_TEMP/wrg-archive.XXXXXX")
          trap 'rm -rf -- "$archive_root"' EXIT
          tar -xzf received/*.tar.gz -C "$archive_root"
          source_dir=$(find "$archive_root" -mindepth 1 -maxdepth 1 -type d)
          test -f "$source_dir/uv.lock"
          test ! -e "$source_dir/.git"
          sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$source_dir" /usr/bin/python3 "$source_dir/tests/uv_install_smoke.py" --project "$source_dir"
  privilege-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise real dropped credentials against disposable root fixtures
        run: sudo env PYTHONPATH=tests /usr/bin/python3 -m unittest test_owner_worker.RootIsolationTests -q
      - name: Prepare isolated final-path environments and reject invalid locks
        run: sudo env PYTHONPATH=. /usr/bin/python3 tests/uv_install_smoke.py
  guard-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise guard installation and recovery on this disposable VM
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 -B tests/guard_install_smoke.py
      - name: Exercise the disposable Paseo service lifecycle
        run: |
          owner_uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$owner_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$owner_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          /usr/bin/python3 tests/integration_paseo_service.py
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject the injected release check failure
        if: inputs.rehearsal_check_failure
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Create and verify the locked environment
        run: |
          uv sync --locked --extra web --group dev --no-build --no-install-project --no-python-downloads --python "$(command -v python)"
          .venv/bin/python scripts/dependency_profiles.py
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/dependency_profiles.py --audit
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: '${{ matrix.language }}'
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          output: sarif
          upload: never
          upload-database: false
      - name: Require complete analysis of the checked-out commit
        env:
          EXPECTED_SHA: '${{ github.sha }}'
          CODEQL_LANGUAGE: '${{ matrix.language }}'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/security_gate.py sarif --language "$CODEQL_LANGUAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif/*.sarif
          if-no-files-found: error
          retention-days: 7
